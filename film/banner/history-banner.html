<!doctype html>
<!--
  The Our History banner: the founder and his son either side of the AVVVS lockup and 1921,
  on warm paper. render.mjs (next to this file) screenshots it to web/public/media/history/.
  Portraits: web/public/media/history/*.webp (the client's sepia drawings, cut out).
-->
<meta charset="utf-8">
<style>
  @font-face { font-family: Castle; src: url('../../web/src/fonts/CastleT.woff2') format('woff2'); }
  html, body { margin: 0; }
  body { width: 1365px; height: 590px; overflow: hidden; }
  .b {
    position: relative; width: 1365px; height: 590px; overflow: hidden;
    background:
      radial-gradient(ellipse 70% 90% at 50% 45%, rgba(255, 250, 238, 0.85), rgba(255, 250, 238, 0) 70%),
      radial-gradient(ellipse 120% 120% at 50% 50%, #F1E7D3 0%, #E6D6B6 70%, #D9C59D 100%);
    font-family: Castle, Georgia, serif; color: #2B1D16;
  }
  /* paper grain */
  .b::before { content: ""; position: absolute; inset: 0; opacity: 0.22; mix-blend-mode: multiply; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.45 0 0 0 0 0.33 0 0 0 0 0.2 0 0 0 0.9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  /* a soft vignette at the edges */
  .b::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 140px rgba(120, 84, 40, 0.28); pointer-events: none; }

  .who { position: absolute; bottom: 104px; width: 360px; display: grid; justify-items: center; }
  .who.left { left: 70px; }
  .who.right { right: 70px; }
  .who img { width: 290px; height: auto; display: block;
    -webkit-mask-image: linear-gradient(to bottom, #000 62%, transparent 100%); mask-image: linear-gradient(to bottom, #000 62%, transparent 100%); }
  .cap { position: absolute; bottom: 44px; left: 0; right: 0; text-align: center; }
  .name { font-size: 22px; line-height: 1.1; color: #2B1D16; }
  .role { margin-top: 6px; font-family: Georgia, serif; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #755A22; }

  .mid { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 520px; display: grid; justify-items: center; text-align: center; }
  .mid img.lock { width: 330px; height: auto; }
  .rule { width: 260px; height: 1px; margin: 26px 0 18px; background: linear-gradient(90deg, transparent, #B08A4A 20%, #B08A4A 80%, transparent); position: relative; }
  .rule::after { content: ""; position: absolute; left: 50%; top: -4px; width: 7px; height: 7px; margin-left: -4px; transform: rotate(45deg); background: #B08A4A; }
  .year { font-size: 150px; line-height: 0.82; color: #6E4A1E; letter-spacing: 0.01em; }
  .line { margin-top: 18px; font-size: 25px; color: #2B1D16; }
  .sub { margin-top: 8px; font-family: Georgia, serif; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #755A22; }
</style>
<div class="b">
  <figure class="who left" style="margin:0">
    <img src="../../web/public/media/history/neelakandan-vaidyar.webp" alt="">
  </figure>
  <figure class="who right" style="margin:0">
    <img src="../../web/public/media/history/ramadas-vaidyar.webp" alt="">
  </figure>
  <div class="cap" style="left:70px; right:auto; width:360px">
    <div class="name">Kaloor Neelakandan Vaidyar</div><div class="role">Founder · 1895–1967</div>
  </div>
  <div class="cap" style="right:70px; left:auto; width:360px">
    <div class="name">K. N. Ramadas Vaidyar</div><div class="role">Second generation · 1934–1998</div>
  </div>
  <div class="mid">
    <img class="lock" src="../../web/public/brand/avvvs-since-1921.svg" alt="">
    <div class="rule"></div>
    <div class="year">1921</div>
    <div class="line">Four generations of Ayurveda</div>
    <div class="sub">Kozhikode, Kerala</div>
  </div>
</div>
